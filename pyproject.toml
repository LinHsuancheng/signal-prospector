[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-prospector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "playwright", "trafilatura"]

[project.scripts]
prospect = "signal_prospector.cli:main"

[tool.setuptools.packages.find]
include = ["signal_prospector*"]
